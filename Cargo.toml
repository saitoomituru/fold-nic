[workspace]
members = ["crates/fold-core", "crates/fold-http-policy", "crates/fold-store"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/saitoomituru/fold-nic"
rust-version = "1.93"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cid = "0.11.3"
multihash-codetable = { version = "0.2.2", default-features = false, features = ["sha2"] }
http = "1.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
