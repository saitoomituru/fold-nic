[workspace]
members = [
  "crates/fold-core",
  "crates/fold-gateway",
  "crates/fold-http-policy",
  "crates/fold-store",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/saitoomituru/fold-nic"
rust-version = "1.93"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cid = "0.11.3"
multihash-codetable = { version = "0.2.2", default-features = false, features = ["sha2"] }
http = "1.5.0"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5.3", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
